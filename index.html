<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07101d"><meta name="description" content="Foot Now football scores">
<link rel="manifest" href="./manifest.json"><link rel="icon" type="image/png" href="./foot_now_icon.png"><title>Foot Now</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101d;color:#fff;font-family:Arial,Tahoma,sans-serif}.app{max-width:720px;margin:auto;padding-bottom:80px}
header{padding:14px;border-bottom:1px solid #203047;position:sticky;top:0;background:#07101df5;z-index:5}.brand{display:flex;gap:10px;align-items:center}.brand img{width:44px;height:44px;border-radius:12px}.brand h1{margin:0;font-size:21px}.muted{color:#9aa9bd}
main{padding:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.btn{padding:10px 13px;border-radius:12px;border:1px solid #203047;background:#111f33;color:#fff}.primary{background:#39ff88;color:#04120a;font-weight:bold}
.card{background:#0d1828;border:1px solid #203047;border-radius:17px;padding:13px;margin:10px 0}.league{color:#ffd166;font-size:12px;margin-bottom:8px}.match{display:grid;grid-template-columns:1fr 75px 1fr;align-items:center;text-align:center;gap:8px}.team img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}.team b{display:block;font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:18px;font-weight:bold}.time,.status{font-size:12px;color:#9aa9bd;margin-top:4px}.live{color:#39ff88}.fav{float:left;background:none;color:#ffd166;border:0;font-size:21px}.empty{text-align:center;padding:30px;color:#9aa9bd}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:720px;margin:auto;background:#09121f;border-top:1px solid #203047;display:grid;grid-template-columns:repeat(4,1fr);z-index:10;padding:7px}.nav{background:none;color:#9aa9bd;padding:7px}.nav.active{color:#39ff88}.nav span{display:block;font-size:11px;margin-top:3px}
.tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}.tabs .btn{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.leagueCard{text-align:center;background:#0d1828;border:1px solid #203047;border-radius:15px;padding:14px;color:#fff}.leagueCard img{width:48px;height:48px;object-fit:contain}.leagueCard b{display:block;margin-top:7px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #203047;background:#091424;color:#fff;margin:7px 0}.error{background:#35151b;border:1px solid #6d1e29;padding:12px;border-radius:12px;color:#ffadb5}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:720px;max-height:90vh;overflow:auto;background:#07101d;border-radius:20px 20px 0 0;padding:15px;margin:auto}.event{padding:8px;border-bottom:1px solid #203047}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px 3px;border-bottom:1px solid #203047;text-align:center}
</style></head><body><div class="app">
<header><div class="brand"><img src="foot_now_icon.png"><div><h1>Foot Now</h1><small class="muted">نتائج ومواعيد كرة القدم</small></div></div></header>
<main id="content"></main>
<nav class="bottom"><button class="nav active" data-p="home">🏠<span>الرئيسية</span></button><button class="nav" data-p="matches">⚽<span>المباريات</span></button><button class="nav" data-p="leagues">🏆<span>البطولات</span></button><button class="nav" data-p="more">☰<span>المزيد</span></button></nav></div>
<div id="modal" class="modal"><div class="sheet"><div class="row"><b id="mt">التفاصيل</b><button class="btn" onclick="closeModal()">إغلاق</button></div><div id="mb"></div></div></div>
<script>
const API='https://v3.football.api-sports.io',TZ='Africa/Cairo',KS='footnow_api_key',FS='footnow_favs';
let S={page:'home',fx:[],leagues:[],favs:JSON.parse(localStorage.getItem(FS)||'[]'),error:''};
const key=()=>localStorage.getItem(KS)||'';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const iso=()=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const add=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const tm=x=>new Intl.DateTimeFormat('ar-EG',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}).format(new Date(x));
const dt=x=>new Intl.DateTimeFormat('ar-EG',{timeZone:TZ,weekday:'short',day:'numeric',month:'short'}).format(new Date(x));
async function api(path){if(!key())throw Error('أضف مفتاح API من «المزيد».');let r=await fetch(API+path,{headers:{'x-apisports-key':key(),Accept:'application/json'}}),d=await r.json();if(!r.ok||(d.errors&&Object.keys(d.errors).length))throw Error(Object.values(d.errors||{}).join(' ')||'خطأ في API');return d}
function stat(f){let s=f.fixture.status.short,e=f.fixture.status.elapsed;if(['1H','2H','ET','P'].includes(s))return `<span class=live>مباشر ${e||''}′</span>`;if(s==='HT')return '<span class=live>استراحة</span>';return {NS:'لم تبدأ',FT:'انتهت',AET:'انتهت',PEN:'ركلات ترجيح',PST:'مؤجلة',CANC:'ملغاة',TBD:'لم تحدد'}[s]||esc(f.fixture.status.long||s)}
function fav(id){return S.favs.includes(id)}
function toggle(id){S.favs=fav(id)?S.favs.filter(x=>x!==id):[...S.favs,id];localStorage.setItem(FS,JSON.stringify(S.favs));render()}
function card(f){let h=f.teams.home,a=f.teams.away,g=f.goals;return `<div class=card onclick="details(${f.fixture.id})"><button class=fav onclick="event.stopPropagation();toggle(${f.fixture.id})">${fav(f.fixture.id)?'★':'☆'}</button><div class=league>${esc(f.league.name)} • ${esc(f.league.country||'')}</div><div class=match><div class=team><img src="${esc(h.logo||'foot_now_icon.png')}" onerror="this.src='foot_now_icon.png'"><b>${esc(h.name)}</b></div><div><div class=score>${g.home==null?'🕒':g.home+' - '+g.away}</div><div class=time>${tm(f.fixture.date)}</div><div class=status>${stat(f)}</div></div><div class=team><img src="${esc(a.logo||'foot_now_icon.png')}" onerror="this.src='foot_now_icon.png'"><b>${esc(a.name)}</b></div></div><div class=muted style="text-align:center;margin-top:7px">${dt(f.fixture.date)}</div></div>`}
async function load(){if(!key()){render();return}S.error='';render();try{let from=iso(),to=add(from,7),[live,range]=await Promise.all([api('/fixtures?live=all&timezone='+encodeURIComponent(TZ)),api(`/fixtures?from=${from}&to=${to}&timezone=${encodeURIComponent(TZ)}`)]),m=new Map();[...(live.response||[]),...(range.response||[])].forEach(x=>m.set(x.fixture.id,x));S.fx=[...m.values()].sort((a,b)=>new Date(a.fixture.date)-new Date(b.fixture.date));let lm=new Map();S.fx.forEach(x=>lm.set(x.league.id,x.league));S.leagues=[...lm.values()]}catch(e){S.error=e.message}render()}
function home(c){if(!key()){c.innerHTML='<div class=card><h2>أهلاً بك في Foot Now ⚽</h2><p class=muted>لا توجد بيانات وهمية. أضف مفتاح API-Football لجلب المباريات الحقيقية.</p><button class="btn primary" onclick="go(\'more\')">إضافة المفتاح</button></div>';return}let live=S.fx.filter(x=>['1H','2H','HT','ET','P'].includes(x.fixture.status.short)),up=S.fx.filter(x=>!['FT','AET','PEN','CANC'].includes(x.fixture.status.short)).slice(0,8);c.innerHTML=`<div class=row><button class="btn primary" onclick="load()">↻ تحديث</button><span class=muted>${S.fx.length} مباراة</span></div><h2>مباشر الآن</h2>${live.length?live.map(card).join(''):'<div class=empty>لا توجد مباريات مباشرة حاليًا.</div>'}<h2>أقرب المباريات</h2>${up.length?up.map(card).join(''):'<div class=empty>لا توجد مباريات حاليًا.</div>'}${S.error?`<div class=error>${esc(S.error)}</div>`:''}`}
function matches(c){c.innerHTML='<div class=tabs><button class=btn onclick="filter(0)">الكل</button><button class=btn onclick="filter(1)">مباشر</button><button class=btn onclick="filter(2)">نتائج</button><button class=btn onclick="filter(3)">قادمة</button><button class=btn onclick="filter(4)">المفضلة</button></div><div id=list></div>';filter(0)}
function filter(t){let a=S.fx;if(t===1)a=a.filter(x=>['1H','2H','HT','ET','P'].includes(x.fixture.status.short));if(t===2)a=a.filter(x=>['FT','AET','PEN'].includes(x.fixture.status.short));if(t===3)a=a.filter(x=>['NS','TBD'].includes(x.fixture.status.short));if(t===4)a=a.filter(x=>fav(x.fixture.id));document.getElementById('list').innerHTML=a.length?a.map(card).join(''):'<div class=empty>لا توجد مباريات.</div>'}
function leagues(c){c.innerHTML=S.leagues.length?'<h2>البطولات</h2><div class=grid>'+S.leagues.map(l=>`<button class=leagueCard onclick="stand(${l.id},'${esc(l.name)}')"><img src="${esc(l.logo||'foot_now_icon.png')}"><b>${esc(l.name)}</b><small class=muted>${esc(l.country||'')}</small></button>`).join('')+'</div>':'<div class=empty>حدّث المباريات أولًا لتظهر البطولات.</div>'}
function more(c){c.innerHTML=`<h2>الإعدادات</h2><div class=card><b>مفتاح API-Football</b><input id=k type=password value="${esc(key())}" placeholder="ضع المفتاح هنا"><button class="btn primary" onclick="saveKey()">حفظ</button><p class=muted>المفتاح محفوظ على جهازك فقط، لا ترسله لأي شخص.</p></div><div class=card><b>مصدر البيانات</b><p class=muted>المباريات والشعارات والأحداث والتشكيلات والإحصائيات تُطلب من API-Football عند الحاجة. لا توجد نتائج وهمية.</p></div>`}
function saveKey(){let v=document.getElementById('k').value.trim();v?localStorage.setItem(KS,v):localStorage.removeItem(KS);go('home');load()}
function go(p){S.page=p;render();if(p==='home'&&key()&&!S.fx.length)load()}
function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.p===S.page));let c=document.getElementById('content');({home,matches,leagues,more}[S.page])(c)}
async function details(id){let mo=document.getElementById('modal'),b=document.getElementById('mb');mo.classList.add('open');b.innerHTML='<div class=empty>جاري التحميل...</div>';try{let d=await api('/fixtures?id='+id+'&timezone='+encodeURIComponent(TZ)),f=d.response?.[0],ev=f?.events||[],st=f?.statistics||[],lu=f?.lineups||[];b.innerHTML=`<div class=card><div class=match><div class=team><img src="${esc(f.teams.home.logo)}"><b>${esc(f.teams.home.name)}</b></div><div><div class=score>${f.goals.home==null?'🕒':f.goals.home+' - '+f.goals.away}</div><div>${stat(f)}</div></div><div class=team><img src="${esc(f.teams.away.logo)}"><b>${esc(f.teams.away.name)}</b></div></div></div><h3>الأحداث</h3>${ev.length?ev.map(e=>`<div class=event>${esc(e.time?.elapsed)}′ — ${esc(e.type)} ${esc(e.detail||'')} — ${esc(e.player?.name||'')}</div>`).join(''):'<p class=muted>لا توجد أحداث متاحة.</p>'}<h3>الإحصائيات</h3>${st.length?st.map(x=>`<div class=card><b>${esc(x.team?.name)}</b>${(x.statistics||[]).slice(0,10).map(s=>`<div class=row><span>${esc(s.type)}</span><b>${esc(s.value)}</b></div>`).join('')}</div>`).join(''):'<p class=muted>لا توجد إحصائيات متاحة.</p>'}<h3>التشكيلات</h3>${lu.length?lu.map(x=>`<div class=card><b>${esc(x.team?.name)}</b><p class=muted>الأساسي: ${(x.startXI||[]).length} • البدلاء: ${(x.substitutes||[]).length}</p></div>`).join(''):'<p class=muted>التشكيلات غير متاحة حاليًا.</p>'}`}catch(e){b.innerHTML=`<div class=error>${esc(e.message)}</div>`}}
function closeModal(){document.getElementById('modal').classList.remove('open')}
async function stand(id,name){let mo=document.getElementById('modal'),b=document.getElementById('mb');document.getElementById('mt').textContent='ترتيب '+name;mo.classList.add('open');b.innerHTML='<div class=empty>جاري التحميل...</div>';try{let d=await api(`/standings?league=${id}&season=${new Date().getFullYear()}`),groups=[];(d.response||[]).forEach(x=>(x.league?.standings||[]).forEach(g=>groups.push(g)));b.innerHTML=groups.length?groups.map(g=>`<table><tr><th>الفريق</th><th>ل</th><th>ف</th><th>ت</th><th>خ</th><th>ن</th></tr>${g.map(r=>`<tr><td>${r.rank}. ${esc(r.team.name)}</td><td>${r.all.played}</td><td>${r.all.win}</td><td>${r.all.draw}</td><td>${r.all.lose}</td><td>${r.points}</td></tr>`).join('')}</table>`).join(''):'<div class=empty>لا يوجد ترتيب متاح لهذا الموسم.</div>'}catch(e){b.innerHTML=`<div class=error>${esc(e.message)}</div>`}}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>go(b.dataset.p)));render();if(key())load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
