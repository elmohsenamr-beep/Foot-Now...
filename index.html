<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foot Now</title>
    <style>
        body {
            background-color: #101010;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            direction: rtl;
            text-align: right;
        }
        .container {
            padding: 15px;
            max-width: 600px;
            margin: auto;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1b1b1d;
            padding: 12px 15px;
            border-bottom: 2px solid #00e676;
        }
        .header h1 {
            color: #00e676;
            font-size: 20px;
            margin: 0;
        }
        .section-title {
            color: #00e676;
            font-size: 18px;
            margin: 15px 0 10px 0;
            font-weight: bold;
        }
        .card {
            background-color: #1b1b1d;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #2c2c2e;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #101010;
            border: 1px solid #2c2c2e;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            margin-top: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .btn {
            background-color: #00e676;
            color: #101010;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .error-msg {
            background-color: rgba(229, 57, 53, 0.2);
            color: #ff5252;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
            border: 1px solid rgba(229, 57, 53, 0.4);
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1b1b1d;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #2c2c2e;
        }
        .nav-item {
            color: #888;
            text-align: center;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
        }
        .nav-item.active {
            color: #00e676;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 30px; height: 30px; background: #00e676; border-radius: 6px; display:flex; align-items:center; justify-content:center; color:#101010; font-weight:bold;">FN</div>
            <h1>Foot Now</h1>
        </div>
        <button class="btn" onclick="fetchMatches()" style="padding: 6px 12px; font-size: 12px;">تحديث</button>
    </div>

    <div class="container">
        <!-- صفحة الرئيسية / المباريات -->
        <div id="page-matches" class="page active">
            <div class="section-title">مباشر الآن</div>
            <div id="live-matches-container">
                <div class="error-msg" id="live-error">جاري التحقق من المفتاح وتحميل المباريات...</div>
            </div>

            <div class="section-title">أقرب المباريات</div>
            <div id="upcoming-matches-container"></div>
        </div>

        <!-- صفحة البطولات -->
        <div id="page-leagues" class="page">
            <div class="section-title">البطولات المتاحة</div>
            <div class="card">
                <p>الدوري الإنجليزي الممتاز</p>
                <p>الدوري الإسباني</p>
                <p>دوري أبطال أوروبا</p>
                <p>دوري روشن السعودي</p>
            </div>
        </div>

        <!-- صفحة الإعدادات (المزيد) -->
        <div id="page-settings" class="page">
            <div class="section-title">الإعدادات</div>
            <div class="card">
                <label for="api-key-input" style="font-weight: bold; font-size: 14px;">مفتاح API-Football</label>
                <input type="text" id="api-key-input" placeholder="ألصق المفتاح هنا...">
                <button class="btn" onclick="saveApiKey()">حفظ</button>
                <p id="save-status" style="color: #00e676; font-size: 12px; margin-top: 8px;"></p>
                <p style="font-size: 12px; color: #aaa; margin-top: 10px;">المفتاح محفوظ على جهازك فقط، لا ترسله لأي شخص.</p>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active" onclick="switchPage('matches', this)">المباريات</button>
        <button class="nav-item" onclick="switchPage('leagues', this)">البطولات</button>
        <button class="nav-item" onclick="switchPage('settings', this)">المزيد</button>
    </div>

    <script>
        function switchPage(pageName, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            if (pageName === 'matches') {
                document.getElementById('page-matches').classList.add('active');
            } else if (pageName === 'leagues') {
                document.getElementById('page-leagues').classList.add('active');
            } else if (pageName === 'settings') {
                document.getElementById('page-settings').classList.add('active');
                const savedKey = localStorage.getItem('foot_now_api_key') || '';
                document.getElementById('api-key-input').value = savedKey;
            }
            element.classList.add('active');
        }

        function saveApiKey() {
            const keyInput = document.getElementById('api-key-input').value.trim();
            const statusText = document.getElementById('save-status');
            if (keyInput) {
                localStorage.setItem('foot_now_api_key', keyInput);
                statusText.style.color = '#00e676';
                statusText.textContent = 'تم حفظ المفتاح بنجاح!';
                setTimeout(() => { statusText.textContent = ''; }, 3000);
                fetchMatches();
            } else {
                statusText.style.color = '#ff5252';
                statusText.textContent = 'الرجاء إدخال مفتاح صحيح!';
            }
        }

        async function fetchMatches() {
            const apiKey = localStorage.getItem('foot_now_api_key');
            const liveContainer = document.getElementById('live-matches-container');
            const upcomingContainer = document.getElementById('upcoming-matches-container');

            if (!apiKey) {
                liveContainer.innerHTML = `<div class="error-msg">مفتاح التطبيق مفقود. الرجاء إدخال المفتاح في صفحة "المزيد" (الإعدادات).</div>`;
                upcomingContainer.innerHTML = '';
                return;
            }

            liveContainer.innerHTML = `<div class="card" style="text-align:center; color:#00e676;">جاري جلب البيانات...</div>`;
            upcomingContainer.innerHTML = '';

            try {
                const today = new Date().toISOString().split('T')[0];
                
                const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${today}`, {
                    method: "GET",
                    headers: {
                        "x-apisports-key": apiKey
                    }
                });

                const data = await response.json();

                if (data.errors && Object.keys(data.errors).length > 0) {
                    liveContainer.innerHTML = `<div class="error-msg">خطأ في المفتاح أو الحساب موقوف: ${JSON.stringify(data.errors)}</div>`;
                    return;
                }

                if (!data.response || data.response.length === 0) {
                    liveContainer.innerHTML = `<div class="card" style="text-align:center; color:#aaa;">لا توجد مباريات مباشرة حالياً لهذا اليوم.</div>`;
                    return;
                }

                let liveHtml = '';
                let upcomingHtml = '';

                data.response.forEach(match => {
                    const status = match.fixture.status.short;
                    const homeTeam = match.teams.home.name;
                    const awayTeam = match.teams.away.name;
                    const homeLogo = match.teams.home.logo;
                    const awayLogo = match.teams.away.logo;
                    const homeGoal = match.goals.home ?? 0;
                    const awayGoal = match.goals.away ?? 0;
                    const leagueName = match.league.name;

                    const cardContent = `
                        <div class="card">
                            <div style="color: #00e676; font-size: 13px; font-weight: bold; margin-bottom: 8px;">${leagueName}</div>
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div style="display: flex; align-items: center; gap: 8px; flex: 1;">
                                    <img src="${homeLogo}" style="width: 28px; height: 28px; object-fit: contain;">
                                    <span style="font-size: 14px; font-weight: bold;">${homeTeam}</span>
                                </div>
                                <div style="background: #2c2c2e; padding: 5px 12px; border-radius: 6px; font-weight: bold; color: #00e676; font-size: 15px;">
                                    ${homeGoal} - ${awayGoal}
                                </div>
                                <div style="display: flex; align-items: center; gap: 8px; flex: 1; justify-content: flex-end; text-align: left;">
                                    <span style="font-size: 14px; font-weight: files; font-weight: bold;">${awayTeam}</span>
                                    <img src="${awayLogo}" style="width: 28px; height: 28px; object-fit: contain;">
                                </div>
                            </div>
                        </div>
                    `;

                    if (['1H', '2H', 'HT', 'ET', 'P', 'LIVE'].includes(status)) {
                        liveHtml += cardContent;
                    } else {
                        upcomingHtml += cardContent;
                    }
                });

                liveContainer.innerHTML = liveHtml || `<div class="card" style="text-align:center; color:#aaa;">لا توجد مباريات مباشرة حالياً.</div>`;
                upcomingContainer.innerHTML = upcomingHtml || `<div class="card" style="text-align:center; color:#aaa;">لا توجد مباريات قادمة مسجلة.</div>`;

            } catch (err) {
                liveContainer.innerHTML = `<div class="error-msg">تعذر الاتصال بالخادم. تحقق من اتصال الإنترنت أو قيود الـ CORS.</div>`;
            }
        }

        window.onload = function() {
            const savedKey = localStorage.getItem('foot_now_api_key');
            if (savedKey) {
                fetchMatches();
            } else {
                document.getElementById('live-matches-container').innerHTML = `<div class="error-msg">الرجاء إدخال مفتاح API الخاص بك في صفحة "المزيد" (الإعدادات) لجلب المباريات.</div>`;
            }
        };
    </script>
</body>
</html>
